# Build on every push and PR; deploy to Cloudflare when main passes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # manual redeploy of main from the Actions tab

permissions:
  contents: read

# Superseded runs on feature branches are cancelled. On main they queue instead, so a deploy that
# is mid-migration is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # wrangler 4 needs Node >= 22. Node 24 ships npm 11, which reads `allowScripts` from
      # package.json: esbuild and workerd run their install scripts, unlisted packages don't.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build # typechecks the app and the worker, then builds dist/
      - run: npm run build:demo # the public demo (demo/), so it never falls behind the app

  # The repo is public: fail on committed secrets or on the owner's personal details.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so both checks see every commit

      # Tokens and keys, including generic high-entropy ones like APP_TOKEN / MCP_TOKEN.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # PERSONAL_DENYLIST is a repo secret: one case-insensitive phrase per line (email, city, ...).
      # Keeping the list in a secret means the phrases themselves are never published. Only file
      # names and commit ids are printed, never the matching text. Forks don't get the secret, so
      # their PRs skip this step.
      - name: Personal data check
        env:
          PERSONAL_DENYLIST: ${{ secrets.PERSONAL_DENYLIST }}
        run: |
          if [ -z "$PERSONAL_DENYLIST" ]; then
            echo "::notice::PERSONAL_DENYLIST is not set; skipping."
            exit 0
          fi
          list=$(mktemp)
          printf '%s\n' "$PERSONAL_DENYLIST" | sed '/^[[:space:]]*$/d' > "$list"
          found=0
          if files=$(git grep -lIiF -f "$list"); then
            echo "::error::Personal data in these files:"
            echo "$files"
            found=1
          fi
          for c in $(git rev-list HEAD); do
            if git show -s --format='%an%n%ae%n%cn%n%ce%n%B' "$c" | grep -qiF -f "$list"; then
              echo "::error::Personal data in the message or author of commit $c"
              found=1
            fi
          done
          exit $found

  deploy:
    needs: [build, scan]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, across all runs. Never cancel one that is running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # If two pushes land close together, only deploy the commit that is still the tip of main;
      # the newer commit's own run deploys it.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $tip; skipping deploy of $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.tip.outputs.current == 'true'
        run: npm ci

      - if: steps.tip.outputs.current == 'true'
        run: npm run build

      # The deployed commit's time (unix seconds). The app compares it with when a feedback item's
      # issue closed to show whether the fix is live (#70).
      - name: Deployed commit time
        id: commit
        if: steps.tip.outputs.current == 'true'
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Uses the wrangler from package-lock.json. Commands run in order and stop at the first
      # failure, so a failed migration means no deploy.
      - name: Migrate D1, then deploy
        if: steps.tip.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply climbing --remote
            deploy --var DEPLOYED_COMMIT_EPOCH:${{ steps.commit.outputs.epoch }}

  # The public demo: the app on sample data, running entirely in the browser (demo/). Static files on
  # GitHub Pages, nothing to do with the Cloudflare deploy above. Needs Pages enabled with source
  # "GitHub Actions" (Settings -> Pages).
  demo:
    needs: [build, scan]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: deploy-demo
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo
      - id: deploy
        uses: actions/deploy-pages@v5
